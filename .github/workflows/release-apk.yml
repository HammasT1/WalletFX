name: Release APK

# Builds a release APK and attaches it to a GitHub Release whenever a
# version tag (v1.0.0, v1.2.3, ...) is pushed. It can also be started by hand
# from the Actions tab, in which case the APK is only kept as a run artifact.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "apk=WalletFX-v$name.apk" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: >
          flutter build apk --release
          --build-name="${{ steps.version.outputs.name }}"
          --build-number="${{ github.run_number }}"

      - name: Rename APK
        run: >
          mv build/app/outputs/flutter-apk/app-release.apk
          "${{ steps.version.outputs.apk }}"

      - name: Upload APK as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk }}
          path: ${{ steps.version.outputs.apk }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: WalletFX ${{ github.ref_name }}
          files: ${{ steps.version.outputs.apk }}
          generate_release_notes: true
